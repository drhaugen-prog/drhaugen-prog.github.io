<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NEXT!</title>
  <meta name="description" content="NEXT! — It’s not over. It’s NEXT!">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,400;1,9..144,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://sibforms.com/forms/end-form/build/sib-styles.css">

  <style>
    :root {
      --black: #171615;
      --aqua: #62AEB5;
      --white: #FFFFFF;
      --soft-black: #3A3836;
      --muted: #8A8680;
      --line: #DDDAD5;
      --error: #8A2E2E;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--white);
    }

    body {
      color: var(--black);
      font-family: "Work Sans", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .page {
      min-height: 100svh;
      width: 100%;
      background: var(--white);
      display: flex;
      justify-content: center;
    }

    .wrap {
      width: min(100%, 470px);
      padding: max(32px, env(safe-area-inset-top)) 24px max(34px, env(safe-area-inset-bottom));
      text-align: center;
    }

    .eyebrow {
      margin: 0;
      color: var(--black);
      font-size: 11px;
      line-height: 1.35;
      font-weight: 600;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .logo {
      display: block;
      width: 100%;
      height: auto;
      margin: 28px auto 22px;
    }

    .headline {
      margin: 0;
      font-family: "Fraunces", Georgia, serif;
      font-size: clamp(23px, 6vw, 29px);
      line-height: 1.2;
      font-weight: 500;
      font-style: italic;
      color: var(--black);
    }

    .belief {
      margin: 11px 0 0;
      color: var(--soft-black);
      font-size: 14px;
      line-height: 1.45;
      font-weight: 500;
      letter-spacing: .02em;
    }

    .coming {
      margin: 19px 0 0;
      color: var(--soft-black);
      font-size: 15px;
      line-height: 1.45;
      font-weight: 400;
    }

    /* --- BREVO FORM: full working markup, NEXT! styling --- */

    .sib-form {
      margin: 27px 0 0 !important;
      padding: 0 !important;
      background: transparent !important;
      text-align: center !important;
    }

    .sib-form-container,
    #sib-container {
      width: 100% !important;
      max-width: none !important;
      margin: 0 !important;
      padding: 0 !important;
      border: 0 !important;
      border-radius: 0 !important;
      background: transparent !important;
    }

    #sib-form {
      margin: 0 !important;
      padding: 0 !important;
    }

    .sib-input,
    .sib-form-block,
    .form__entry,
    .form__label-row,
    .entry__field {
      margin: 0 !important;
      padding: 0 !important;
      background: transparent !important;
      border: 0 !important;
    }

    .entry__label,
    .entry__specification {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0,0,0,0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }

    #EMAIL {
      display: block !important;
      width: 100% !important;
      height: 56px !important;
      margin: 0 !important;
      padding: 0 16px !important;
      border: 1px solid var(--line) !important;
      border-radius: 0 !important;
      outline: 0 !important;
      background: var(--white) !important;
      color: var(--black) !important;
      box-shadow: none !important;
      appearance: none !important;
      font-family: "Work Sans", Arial, sans-serif !important;
      font-size: 16px !important;
      font-weight: 400 !important;
      line-height: 56px !important;
      text-align: center !important;
    }

    #EMAIL::placeholder {
      color: #A19C95 !important;
      opacity: 1 !important;
      text-align: center !important;
    }

    #EMAIL:focus {
      border-color: var(--aqua) !important;
    }

    .entry__error {
      display: block !important;
      min-height: 0 !important;
      margin: 8px 0 0 !important;
      padding: 0 !important;
      border: 0 !important;
      background: transparent !important;
      color: var(--error) !important;
      font-family: "Work Sans", Arial, sans-serif !important;
      font-size: 12px !important;
      line-height: 1.35 !important;
      text-align: center !important;
    }

    .sib-form-block__button {
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      width: 100% !important;
      height: 56px !important;
      margin: 11px 0 0 !important;
      padding: 0 20px !important;
      border: 1px solid var(--black) !important;
      border-radius: 0 !important;
      background: var(--black) !important;
      color: var(--white) !important;
      box-shadow: none !important;
      cursor: pointer !important;
      font-family: "Work Sans", Arial, sans-serif !important;
      font-size: 13px !important;
      font-weight: 600 !important;
      line-height: 1 !important;
      letter-spacing: .14em !important;
      text-transform: uppercase !important;
      text-align: center !important;
    }

    .sib-form-block__button:hover {
      opacity: .88;
    }

    .sib-form-block__button .icon {
      width: 16px !important;
      height: 16px !important;
      margin-right: 8px !important;
    }

    .sib-form-message-panel {
      display: none;
      width: 100% !important;
      max-width: none !important;
      margin: 18px 0 0 !important;
      padding: 0 !important;
      border: 0 !important;
      border-radius: 0 !important;
      background: transparent !important;
      color: var(--soft-black) !important;
      font-family: "Work Sans", Arial, sans-serif !important;
      font-size: 14px !important;
      line-height: 1.45 !important;
      text-align: center !important;
    }

    .sib-form-message-panel__text {
      justify-content: center !important;
      padding: 0 !important;
    }

    .sib-form-message-panel .sib-notification__icon {
      display: none !important;
    }

    .domain {
      margin: 31px 0 0;
      color: #A19C95;
      font-size: 12px;
      line-height: 1;
      letter-spacing: .04em;
    }

    @media (min-width: 700px) {
      .wrap {
        width: 520px;
        max-width: 520px;
        padding-top: 46px;
      }
    }
  </style>
</head>

<body>
