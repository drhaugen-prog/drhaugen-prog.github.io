<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXT!</title>
<meta name="description" content="NEXT! — It’s not over. It’s NEXT!">
<link rel="stylesheet" href="https://sibforms.com/forms/end-form/build/sib-styles.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,400;1,9..144,500&family=Work+Sans:wght@400;500;600&display=swap');

*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#fff}
body{color:#171615;font-family:'Work Sans',sans-serif}
.page{width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center}
.wrap{width:100%;max-width:460px;padding:28px 24px 34px;text-align:center}
.audience{margin:0;font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase}
.logo-wrap{margin:38px auto 24px;width:100%}
.logo-wrap img{display:block;width:100%;height:auto}
.statement{margin:24px 0 0;font-family:'Fraunces',serif;font-style:italic;font-weight:500;font-size:clamp(22px,5.5vw,28px);line-height:1.3}
.belief{margin:8px 0 0;font-size:14px;font-weight:500;letter-spacing:.02em;color:#3A3836}
.coming{margin:16px 0 0;font-size:15px;color:#3A3836}

.sib-form{padding:0!important;margin:0!important;background:transparent!important;text-align:center!important}
.sib-form-container,#sib-container{max-width:none!important;width:100%!important;padding:0!important;margin:0!important;background:transparent!important;border:0!important;border-radius:0!important}
#sib-form{margin-top:28px}
.sib-input,.sib-form-block{padding:0!important}
.form__label-row{display:block!important}
.entry__label,.entry__specification{display:none!important}
.entry__field{background:transparent!important;border:0!important;padding:0!important}

#EMAIL{
  width:100%!important;
  padding:15px 16px!important;
  border:1px solid #DDDAD5!important;
  border-radius:0!important;
  background:#fff!important;
  color:#171615!important;
  font-family:'Work Sans',sans-serif!important;
  font-size:16px!important;
  line-height:1.2!important;
  text-align:center!important;
  box-shadow:none!important;
}
#EMAIL::placeholder{
  color:#9B9791!important;
  text-align:center!important;
  font-family:'Work Sans',sans-serif!important
}
#EMAIL:focus{outline:none!important;border-color:#62AEB5!important}

.entry__error{
  display:block;
  margin:8px 0 0!important;
  padding:0!important;
  border:0!important;
  background:transparent!important;
  color:#8A2E2E!important;
  font-family:'Work Sans',sans-serif!important;
  font-size:12px!important;
  text-align:center!important
}

.sib-form-block__button{
  width:100%!important;
  margin-top:10px!important;
  padding:15px 24px!important;
  border:1px solid #171615!important;
  border-radius:0!important;
  background:#171615!important;
  color:#fff!important;
  font-family:'Work Sans',sans-serif!important;
  font-size:13px!important;
  font-weight:600!important;
  letter-spacing:.12em!important;
  text-transform:uppercase!important;
  text-align:center!important;
  cursor:pointer
}

.sib-form-message-panel{
  display:none;
  max-width:none!important;
  margin:20px 0 0!important;
  padding:0!important;
  border:0!important;
  background:transparent!important;
  color:#3A3836!important;
  font-family:'Work Sans',sans-serif!important;
  font-size:14px!important;
  text-align:center!important
}
.sib-form-message-panel__text{justify-content:center!important;padding:0!important}
.sib-form-message-panel .sib-notification__icon{display:none!important}
footer{margin-top:32px;font-size:12px;color:#8A8680;letter-spacing:.03em}
</style>
</head>
<body>
<div class="page">
  <div class="wrap">
    <p class="audience">For women curious about what's next</p>

    <div class="logo-wrap">
      <img src="next-logo.png" alt="NEXT!">
    </div>

    <p class="statement">It’s not over. It’s NEXT!</p>
    <p class="belief">There’s a NEXT. And NEXT is better.</p>
    <p class="coming">The inaugural NEXT! gathering is coming.</p>

    <div class="sib-form">
      <div id="sib-form-container" class="sib-form-container">

        <div id="error-message" class="sib-form-message-panel">
          <div class="sib-form-message-panel__text sib-form-message-panel__text--center">
            <span class="sib-form-message-panel__inner-text">
              Your subscription could not be saved. Please try again.
            </span>
          </div>
        </div>

        <div id="success-message" class="sib-form-message-panel">
          <div class="sib-form-message-panel__text sib-form-message-panel__text--center">
            <span class="sib-form-message-panel__inner-text">
              You’re in. Your NEXT! starts here.
            </span>
          </div>
        </div>

        <div id="sib-container" class="sib-container--large sib-container--vertical">
          <form id="sib-form"
                method="POST"
                action="https://72787623.sibforms.com/serve/MUIFANhzfxt4Rq23TnUo_JZq5CyxJHfclEeHZgUE8OtbToia5lk9Z09fA5aUv-YmIyOypP-rpZdTlSNfpbgoxQrw30X4plxHEAVP1H5CVv6qGiGhDNnjaLHpuuJjJcCXfVaLs4qCeq8T2WATfDY6QzK61Xc3lr4sgRoHKonWiPxwy-U9ZJgkBKi9XOOE2WIHcDYjAWrydgAgDVhDIQ=="
                data-type="subscription">

            <div class="sib-input sib-form-block">
              <div class="form__entry entry_block">
                <div class="form__label-row">
                  <label class="entry__label" for="EMAIL" data-required="*">Email</label>
                  <div class="entry__field">
                    <input class="input"
                           type="text"
                           id="EMAIL"
                           name="EMAIL"
                           autocomplete="email"
                           placeholder="Your email"
                           data-required="true"
                           required>
                  </div>
                </div>
                <label class="entry__error entry__error--primary"></label>
                <label class="entry__specification">Enter your email to join us.</label>
              </div>
            </div>

            <div class="sib-form-block">
              <button class="sib-form-block__button sib-form-block__button-with-loader"
                      form="sib-form"
                      type="submit">
                I'M IN
              </button>
            </div>

            <input type="text" name="email_address_check" value="" class="input--hidden">
            <input type="hidden" name="locale" value="en">
          </form>
        </div>
      </div>
    </div>

    <footer>nextisbetter.com</footer>
  </div>
</div>

<script>
window.REQUIRED_CODE_ERROR_MESSAGE = 'Please choose a country code';
window.LOCALE = 'en';
window.EMAIL_INVALID_MESSAGE = window.SMS_INVALID_MESSAGE =
  "The information provided is invalid. Please review the field format and try again.";
window.REQUIRED_ERROR_MESSAGE = "Enter your email to join us.";
window.GENERIC_INVALID_MESSAGE =
  "The information provided is invalid. Please review the field format and try again.";
window.INVALID_NUMBER =
  "The information provided is invalid. Please review the field format and try again.";
window.INVALID_DATE = "Please enter a valid date";
window.REQUIRED_MULTISELECT_MESSAGE = 'Please select at least 1 option';
window.translation = {
  common: {
    selectedList: '{quantity} list selected',
    selectedLists: '{quantity} lists selected',
    selectedOption: '{quantity} selected',
    selectedOptions: '{quantity} selected'
  }
};
var AUTOHIDE = Boolean(1);
</script>
<script defer src="https://sibforms.com/forms/end-form/build/main.js"></script>
</body>
</html>
