<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXT!</title>
<meta name="description" content="NEXT! is coming.">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,400;1,9..144,500&family=Work+Sans:wght@400;500;600&display=swap');

*{ box-sizing: border-box; margin: 0; padding: 0; }

html, body{
  background: #FFFFFF;
  height: 100%;
}

body{
  color: #171615;
  font-family: 'Work Sans', sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  background: #FFFFFF;
}

.page{
  width: 100%;
  background: #FFFFFF;
  display: flex;
  align-items: center;
  justify-content: center;
}

.wrap{
  width: 100%;
  max-width: 460px;
  padding: 28px 24px;
  text-align: center;
  background: #FFFFFF;
}

.audience{
  font-family: 'Work Sans', sans-serif;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: #171615;
}

.logo-wrap{
  margin-top: 18px;
  display: flex;
  justify-content: center;
}
.logo-wrap img{
  width: 100%;
  max-width: 380px;
  height: auto;
  display: block;
}

.statement{
  margin-top: 8px;
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-weight: 500;
  font-size: clamp(22px, 5.5vw, 28px);
  line-height: 1.3;
  color: #171615;
}

.coming{
  margin-top: 16px;
  font-family: 'Work Sans', sans-serif;
  font-size: 15px;
  color: #3A3836;
}

form{
  margin-top: 28px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

input[type="email"]{
  font-family: 'Work Sans', sans-serif;
  font-size: 16px;
  padding: 14px 16px;
  background: #FFFFFF;
  border: 1px solid #DDDAD5;
  color: #171615;
  text-align: center;
  transition: border-color .2s ease;
}
input[type="email"]::placeholder{ color: #8A8680; }
input[type="email"]:focus{ outline: none; border-color: #62AEB5; }

button{
  font-family: 'Work Sans', sans-serif;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 15px 24px;
  background: #171615;
  color: #FFFFFF;
  border: 1px solid #171615;
  cursor: pointer;
  transition: opacity .2s ease;
}
button:hover{ opacity: 0.85; }

.hp-field{ position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }

footer{
  margin-top: 32px;
  font-size: 12px;
  color: #8A8680;
  letter-spacing: 0.03em;
}
</style>
</head>
